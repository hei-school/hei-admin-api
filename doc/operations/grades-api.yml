  examsStudentsGrade:
    get:
      tags:
        - Grades
      summary: Return a participant with his exam grade
      operationId: getParticipantGrade
      parameters:
        - name: exam_id
          in: path
          required: true
          schema:
            type: string
        - name: student_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The specified participant with his grade
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/Grade'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
