      summary: Import students exam grade updated from an excel file
      operationId: importStudentsExamGradeUpdated
      parameters:
        - name: exam_id
          in: path
          required: true
          schema:
            type: string
        - name: comment
          in: query
          required: true
          schema:
            type: string
      requestBody:
        description: Form containing the xlsx file for students exam grade to update
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '../components.yml#/components/schemas/UploadFile'
      responses:
        '200':
          description: Status of the validation of imported students exam grade updated
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/ImportGradeResult'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
