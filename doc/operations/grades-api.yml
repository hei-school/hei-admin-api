operations:
  getGradesByStudentId:
    get:
      tags:
        - Grades
      summary: Get student grades.
      operationId: getGradesByStudentId
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            $ref: '../components.yml#/components/schemas/Page'
          description: Set value to 1 by default if null is provided
          required: false
        - name: page_size
          in: query
          description: Set value to 15 by default if null is provided
          schema:
            $ref: '../components.yml#/components/schemas/PageSize'
      responses:
        '200':
          description: List of a student's grades, showing the exam and the course of these grades.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/Grade'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  getYearlyResult:
    get:
      tags:
        - Grades
      summary: Get the yearly result of a given student for the given level.
      operationId: getYearlyResult
      parameters:
        - $ref: "../components.yml#/components/parameters/PathStudentId"
        - name: student_level
          required: true
          in: path
          schema:
            $ref: "../components.yml#/components/schemas/StudentLevel"
      responses:
        '200':
          description: Yearly result of the specified student.
          content:
            application/json:
              schema:
                $ref: "../components.yml#/components/schemas/YearlyResult"
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  getYearlyResultTranscript:
    get:
      tags:
        - Grades
      summary: Get the yearly result transcript of a given student for the given level.
      operationId: getYearlyResultTranscript
      parameters:
        - $ref: "../components.yml#/components/parameters/PathStudentId"
        - name: student_level
          required: true
          in: path
          schema:
            $ref: "../components.yml#/components/schemas/StudentLevel"
      responses:
        '200':
          description: Yearly result transcript for the specified student.
          content:
            application/json:
              schema:
                $ref: "../components.yml#/components/schemas/YearlyResultGenerationTranscript"
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  getCourseGrades:
    get:
      tags:
        - Grades
      summary: Get the Grades of a given student for a given course.
      operationId: getCourseGrades
      parameters:
        - $ref: '../components.yml#/components/parameters/Page'
        - $ref: '../components.yml#/components/parameters/PageSize'
        - $ref: '../components.yml#/components/parameters/UpdateDateSort'
        - $ref: "../components.yml#/components/parameters/PathStudentId"
        - $ref: "../components.yml#/components/parameters/PathCourseId"
      responses:
        '200':
          description: List of Grades of the specified student.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "../components.yml#/components/schemas/Grade"
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
