        - Grades
      operationId: getOrderedGradeHistory
      summary: Get the history for specific garde
      parameters:
        - $ref: '../components.yml#/components/parameters/PathGradeId'
        - $ref: '../components.yml#/components/parameters/Page'
        - $ref: '../components.yml#/components/parameters/PageSize'
        - $ref: '../components.yml#/components/parameters/DatetimeFromFilter'
        - $ref: '../components.yml#/components/parameters/DatetimeToFilter'
        - name: comment
          in: query
          description: filter results if the string contains this one given - case insensitive
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Change history for specific garde
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/GradeHistory'
        '400':
