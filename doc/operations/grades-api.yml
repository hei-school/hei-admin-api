      tags:
        - Grades
      summary: Import students exam grade from an excel file
      operationId: importStudentsExamGrade
      parameters:
        - name: exam_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: Form containing the xlsx file for students exam grade to import
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "../components.yml#/components/schemas/UploadFile"
      responses:
        '200':
          description: Status of the validation of imported students exam grade
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/ImportGradeResult'
        '400':
          $ref: '../components.yml#/components/responses/400'
