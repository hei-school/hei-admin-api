      tags:
        - Grades
      summary: Return all students with their grade
      operationId: getStudentGradesForExam
      parameters:
        - name: exam_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '../components.yml#/components/parameters/Page'
        - $ref: '../components.yml#/components/parameters/PageSize'
        - $ref: '../components.yml#/components/parameters/StudentRef'
      responses:
        '200':
          description: All students grades from an exam specific
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/StudentGrade'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
    post:
      tags:
        - Grades
      summary: Create student grades in exam
      operationId: createParticipantsGradeForExam
      parameters:
        - name: exam_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: Created grades for a specific students in exam
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components.yml#/components/schemas/CreateGrade'
      responses:
        '200':
          description: All students grades from an exam specific
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/StudentGrade'
