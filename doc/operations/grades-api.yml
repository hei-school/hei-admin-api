        '500':
          $ref: '../components.yml#/components/responses/500'
  getResultsSummary:
    get:
      tags:
        - Grades
      summary: Get the results of a given student for all levels
      operationId: getResultsSummary
      parameters:
        - $ref: "../components.yml#/components/parameters/PathStudentId"
      responses:
        '200':
          description: Yearly result of the specified student.
          content:
            application/json:
              schema:
                $ref: "../components.yml#/components/schemas/ResultSummary"
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  getResultsSummaryTranscript:
    get:
      tags:
        - Grades
      summary: Get over all the results summary transcript of a given student
      operationId: getResultsSummaryTranscript
      parameters:
        - $ref: "../components.yml#/components/parameters/PathStudentId"
      responses:
        '200':
          description: Pdf file of all results summary transcript of the specified student.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
