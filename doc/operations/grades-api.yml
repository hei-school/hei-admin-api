    post:
      tags:
        - Grades
      summary: Create a participant exam grade
      operationId: createParticipantGrade
      parameters:
        - name: exam_id
          in: path
          required: true
          schema:
            type: string
        - name: student_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: Specific student's grade which should be creates
        required: true
        content:
          application/json:
            schema:
              $ref: '../components.yml#/components/schemas/CreateGrade'
      responses:
        '200':
          description: The created grade for the specified student
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/Grade'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
