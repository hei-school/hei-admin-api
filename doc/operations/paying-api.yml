    put:
      tags:
        - Paying
      summary: |
        Create a MPBS.
        Only the student that owns the fee can do it.
        No manager nor teacher can.
      description: |
        The payload has no `amount` field
        since a MPBS implicitly pays the remaining unpaid amount of the fee.

        In case the amount paid by the student differs,
        then the (scheduled) verifications will fail and manual fix from a manager is required.

        When the verification succeeds, and only then,
        a `Fee.Payment` object is automatically created to reflect the `Fee.Mbps`.
      operationId: crupdateMpbs
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: string
        - name: fee_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: The MPBS to create
        required: true
        content:
          application/json:
            schema:
              $ref: '../components.yml#/components/schemas/CrupdateMpbs'
      responses:
        '200':
          description: The created MPBS
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/Mpbs'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
