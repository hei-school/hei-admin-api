operations:
  createDelayPenaltyChange:
    post:
      tags:
        - Paying
      summary: Change current delay penalty configuration
      operationId: createDelayPenaltyChange
      requestBody:
        description: Delay penalties to create
        required: true
        content:
          application/json:
            schema:
              $ref: '../components.yml#/components/schemas/CreateDelayPenaltyChange'
      responses:
        '200':
          description: List of created delay penalties
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/DelayPenalty'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  getDelayPenalty:
    get:
      tags:
        - Paying
      summary: Get current delay penalty
      operationId: getDelayPenalty
      responses:
        '200':
          description: Active delay penalty
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/DelayPenalty'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  getPaidFeeReceipt:
    get:
      tags:
        - Paying
      summary: Get receipt of paid fee
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: string
        - name: fee_id
          in: path
          required: true
          schema:
            type: string
        - name: payment_id
          in: path
          required: true
          schema:
            type: string
      operationId: getPaidFeeReceipt
      responses:
        '200':
          description: Paid fee receipt
          content:
            application/pdf:
              schema:
                type: string
                format: byte
                example: PDF VERSION
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  generateFeeReceipts:
    put:
      tags:
        - Paying
      summary: Send email with a S3 pre-sign link of fee receipts in a mandatory date range
      requestBody:
        description: fee receipts info to send
        required: true
        content:
          application/json:
            schema:
              $ref: '../components.yml#/components/schemas/GenerationReceiptsRequest'
      operationId: generateFeeReceipts
      responses:
        '200':
          description: statistic about fee receipts to process
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/GeneratedReceiptsStatistic'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  studentsFeesById:
    get:
      tags:
        - Paying
      summary: Get student fee by identifier
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: string
        - name: fee_id
          in: path
          required: true
          schema:
            type: string
      operationId: getStudentFeeById
      responses:
        '200':
          description: Identified student fee
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/Fee'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
    delete:
      tags:
        - Paying
      summary: Delete student fee by identifier.
      description: Soft delete
      operationId: deleteStudentFeeById
      parameters:
        - name: fee_id
          in: path
          required: true
          schema:
            type: string
        - name: student_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: student fee deleted by identifier.
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/Fee'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
    patch:
      tags:
        - Paying
      summary: Archive student fee.
      operationId: archiveStudentFee
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: string
        - name: fee_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: student fee archived.
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/Fee'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  studentsFees:
    get:
      tags:
        - Paying
      summary: Get all student fees ordered by due datetime desc
      description: Fees can be filtered with an optional payment status parameter.
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            $ref: '../components.yml#/components/schemas/Page'
        - name: page_size
          in: query
          schema:
            $ref: '../components.yml#/components/schemas/PageSize'
        - name: status
          in: query
          schema:
            $ref: '../components.yml#/components/schemas/FeeStatusEnum'
      operationId: getFeesByStudentId
      responses:
        '200':
          description: List of all student fees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/Fee'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
    post:
      tags:
        - Paying
      summary: Create student fees
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: string
      operationId: createStudentFees
      requestBody:
        description: Student fees to create
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components.yml#/components/schemas/CreateFee'
      responses:
        '200':
          description: Created student fees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/Fee'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
    put:
      tags:
        - Paying
      summary: Update student fees, can only modify due_datetime and comment, must contain an ID
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: string
      operationId: updateStudentFees
      requestBody:
        description: Student fees to update
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components.yml#/components/schemas/Fee'
      responses:
        '200':
          description: Update student fees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/Fee'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  generateFeesListAsXlsx:
    get:
      tags:
        - Paying
      summary: Generate fees list as xlsx
      operationId: generateFeesListAsXlsx
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '../components.yml#/components/schemas/FeeStatusEnum'
        - name: from_due_datetime
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to_due_datetime
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of fees in a xlsx file
          content:
            application/xlsx:
              schema:
                type: string
                format: byte
                example: XLSX VERSION
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  fees:
    put:
      tags:
        - Paying
      summary: Crupdate student fees
      operationId: crupdateStudentFees
      requestBody:
        description: Student fees to update if id is provided, create otherwise.
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components.yml#/components/schemas/CrupdateStudentFee'
      responses:
        '200':
          description: Created or updated student fees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/Fee'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
    get:
      tags:
        - Paying
      summary: Get all student fees filtered by status and month
      parameters:
        - name: transaction_status
          required: false
          in: query
          schema:
            $ref: '../components.yml#/components/schemas/MpbsStatus'
        - name: type
          required: false
          in: query
          schema:
            $ref: '../components.yml#/components/schemas/FeeTypeEnum'
        - name: status
          in: query
          description: "See the PaymentStatus object for its value."
          schema:
            type: string
            default: LATE
            allOf:
              - $ref: '../components.yml#/components/schemas/FeeStatusEnum'
        - name: category
          in: query
          schema:
            type: string
            allOf:
              - $ref: '../components.yml#/components/schemas/FeeCategory'
        - name: month_from
          in: query
          schema:
            type: string
            format: date-time
          required: false
        - name: month_to
          in: query
          schema:
            type: string
            format: date-time
          required: false
        - name: page
          in: query
          schema:
            $ref: '../components.yml#/components/schemas/Page'
        - name: page_size
          in: query
          schema:
            $ref: '../components.yml#/components/schemas/PageSize'
        - name: isMpbs
          in: query
          schema:
            type: boolean
        - name: student_ref
          in: query
          required: false
          schema:
            type: string
      operationId: getFees
      responses:
        '200':
          description: List of filtered student fees
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/FeesWithStats'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  getFeesStats:
    get:
      tags:
        - Paying
      summary: Get monthly statistics on Fees, the actual month by default
      parameters:
        - name: month_from
          in: query
          schema:
            type: string
            format: date-time
          required: false
        - name: month_to
          in: query
          schema:
            type: string
            format: date-time
          required: false
      operationId: getFeesStats
      responses:
        '200':
          description: Fees stats info
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/FeesStatistics'
  generateAdvancedStats:
    post:
      tags:
        - Paying
      summary: Triggers a generation of the statistics of all the fees in the given date range to cache them
      parameters:
        - name: date_from
          in: query
          schema:
            type: string
            format: date-time
          required: true
        - name: date_to
          in: query
          schema:
            type: string
            format: date-time
          required: true
      operationId: generateAdvancedStats
      responses:
        '200':
          description: Advanced Fees stats info
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/AdvancedFeeStatisticsGeneration'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  getAdvancedFeesStats:
    get:
      tags:
        - Paying
      summary: Get advanced monthly statistics on Fees, the actual month by default
      parameters:
        - name: month_from
          in: query
          schema:
            type: string
            format: date
          required: false
        - name: month_to
          in: query
          schema:
            type: string
            format: date
          required: false
        - name: type
          in: query
          schema:
            $ref: "../components.yml#/components/schemas/AdvancedFeeStatisticsType"
      operationId: getAdvancedFeesStats
      responses:
        '200':
          description: Advanced Fees stats info
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/AdvancedFeesStatistics'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  exportAllFees:
    get:
      tags:
        - Paying
      summary: Generate fees xlxs file with an optional month range.
      description: Generate an fees excel file, stores it in (S3 compatible storage), and returns a presigned URL that can later be user to view the file.
      operationId: exportAllFees
      parameters:
        - name: month_from
          in: query
          schema:
            type: string
            format: date-time
          required: false
        - name: month_to
          in: query
          schema:
            type: string
            format: date-time
          required: false
        - name: type
          in: query
          required: true
          schema:
            $ref: "../components.yml#/components/schemas/AdvancedFeeStatisticsType"
      responses:
        '200':
          description: File successfully generated and stored
          content:
            text/plain:
              schema:
                type: string
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  exportAdvancedFeesStats:
    get:
      tags:
        - Paying
      summary: Generate advanced fees statistics file with an optional month range.
      description: Generates an advanced fees statistics excel file, stores it in
        (S3 compatible storage), and returns a presigned URL that can
        later be used to view the file.
      operationId: exportAdvancedFeesStats
      parameters:
        - name: month_from
          in: query
          schema:
            type: string
            format: date
          required: false
        - name: month_to
          in: query
          schema:
            type: string
            format: date
          required: false
        - name: type
          in: query
          required: true
          schema:
            $ref: "../components.yml#/components/schemas/AdvancedFeeStatisticsType"
        - name: status
          in: query
          description: "See the PaymentStatus object for its value."
          required: false
          schema:
            type: string
            allOf:
              - $ref: '../components.yml#/components/schemas/FeeStatusEnum'
      responses:
        '200':
          description: File successfully generated and stored
          content:
            text/plain:
              schema:
                type: string
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  getFeeTemplates:
    get:
      deprecated: true
      tags:
        - Paying
      summary: Get all fee templates
      parameters:
        - name: name
          in: query
          schema:
            type: string
        - name: amount
          in: query
          schema:
            type: integer
        - name: number_of_payments
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            $ref: '../components.yml#/components/schemas/Page'
        - name: page_size
          in: query
          schema:
            $ref: '../components.yml#/components/schemas/PageSize'
      operationId: getFeeTemplates
      responses:
        '200':
          description: List of templates of fee
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/FeeTemplate'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  feeTemplatesContentOperations:
    get:
      tags:
        - Paying
      summary: Retrieve existing fee template content
      parameters:
        - in: path
          name: id
          description: Fee template identifier
          schema:
            type: string
          required: true
      operationId: getContentByFeeTemplateId
      responses:
        '200':
          description: List of fee template content
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/FeeTemplateContent'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
    put:
      tags:
        - Paying
      summary: Update contents for a specific fee templates
      parameters:
        - in: path
          name: id
          description: Fee template identifier
          schema:
            type: string
          required: true
      operationId: crupdateFeeTemplatesContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components.yml#/components/schemas/FeeTemplateContent'
      responses:
        '200':
          description: Updated fee template content
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/FeeTemplateContent'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  feeTemplatesOperations:
    get:
      tags:
        - Paying
      summary: Get existing fee templates
      parameters:
        - name: page
          in: query
          schema:
            $ref: '../components.yml#/components/schemas/Page'
        - name: pageSize
          in: query
          schema:
            $ref: '../components.yml#/components/schemas/PageSize'
      operationId: getV2FeeTemplates
      responses:
        '200':
          description: List of fee templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/V2FeeTemplate'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
    put:
      tags:
        - Paying
      summary: Create or update existing fee templates
      operationId: crupdateV2FeeTemplates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components.yml#/components/schemas/V2CrupdateFeeTemplate'
      responses:
        '200':
          description: List of created or updated fee templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/V2FeeTemplate'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  feeCreationJobsOperations:
    get:
      tags:
        - Paying
      summary: Get list of existing fee creation jobs
      operationId: getFeeCreationJobs
      parameters:
        - name: page
          in: query
          schema:
            $ref: '../components.yml#/components/schemas/Page'
        - name: page_size
          in: query
          schema:
            $ref: '../components.yml#/components/schemas/PageSize'
      responses:
        '200':
          description: List of existing fee creation jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/FeeCreationJob'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
    put:
      tags:
        - Paying
      summary: Create fee creation jobs
      description: |
        Asynchronously create fees for each provided student reference,
        from the contents of the fee template identified by `fee_template_id`.
        One task is created per student reference, and each task creates
        as many fees as the template holds contents.
        Each job identifier is provided by the client, so submitting twice the
        same identifier does not enqueue the same work twice.
        The returned jobs are meant to be polled through `GET /feeCreationJobs/{id}`
        until their `status.progression` reaches `FINISHED`.
        Unknown student references, and students already charged through a former
        job for the same template, are not rejected upfront: they are reported
        in the `failures` of the corresponding job.
      operationId: crupdateFeeCreationJobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components.yml#/components/schemas/CrupdateFeeCreationJob'
      responses:
        '200':
          description: Accepted fee creation jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/FeeCreationJob'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  getFeeCreationJob:
    get:
      tags:
        - Paying
      summary: Get a fee creation job by id
      description: |
        Retrieve the current state of a fee creation job.
        While `status.progression` is not `FINISHED`, `status.health` stays `UNKNOWN`
        and the counters reflect the tasks processed so far.
      parameters:
        - in: path
          name: id
          description: Fee creation job identifier
          schema:
            type: string
          required: true
      operationId: getFeeCreationJobById
      responses:
        '200':
          description: The fee creation job
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/FeeCreationJob'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
