        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  students:
    get:
      tags:
        - Users
      summary: Get all students
      operationId: getStudents
      parameters:
        - name: page
          in: query
          schema:
            $ref: '../components.yml#/components/schemas/Page'
        - name: page_size
          in: query
          schema:
            $ref: '../components.yml#/components/schemas/PageSize'
        - name: ref
          in: query
          description: "Filter students by ref, case is ignored"
          schema:
            type: string
        - name: first_name
          in: query
          description: "Filter students by first name, case is ignored"
          schema:
            type: string
        - name: last_name
          in: query
          description: "Filter students by last name, case is ignored"
          schema:
            type: string
        - name: course_id
          in: query
          description: "Filter students by course they are linked to"
          schema:
            type: string
        - name: status
          required: false
          in: query
          description: Filter students by status value return all by default
          schema:
            $ref: '../components.yml#/components/schemas/EnableStatus'
        - name: sex
          required: false
          in: query
          description: Filter students by sex value return all by default
          schema:
            $ref: '../components.yml#/components/schemas/Sex'
        - name: work_study_status
          required: false
          in: query
          description: Filter students by work study status
          schema:
            $ref: '../components.yml#/components/schemas/WorkStudyStatus'
        - name: commitment_begin_date
          required: false
          in: query
          description: Filter students by commitment begin date
          schema:
            type: string
            format: date-time
        - name: exclude_groups
          required: false
          in: query
          style: form
          explode: true
          description: List of group ids to exclude students from
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: List of students, ordered by ref.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/Student'

        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
    put:
      tags:
        - Users
      summary: Create new students or update existing students
      description: Update students when `id` are provided, create them otherwise.
      operationId: createOrUpdateStudents
      parameters:
        - name: due_datetime
          required: false
          in: query
          schema:
            type: string
            format: date-time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components.yml#/components/schemas/CrupdateStudent'
      responses:
        '200':
          description: The created or updated students
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '../components.yml#/components/schemas/Student'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  getStudentImportTemplateURL:
    get:
      tags:
        - Users
      summary: Get a presigned url to get the template for student import
      operationId: getStudentImportTemplateURL
      responses:
        '200':
          description: The presigned URL for getting the student import template
          content:
            text/plain:
              schema:
                type: string
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  importStudents:
    post:
      tags:
        - Users
      summary: Import students from an excel file
      operationId: importStudents
      parameters:
        - in: query
          name: due_datetime
          required: false
          schema:
            type: string
            format: date-time
      requestBody:
        description: Form containing the xlsx file for students to import
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '../components.yml#/components/schemas/UploadFile'
      responses:
        '200':
          description: Status of the validation of imported students
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/StudentImportValidationResult'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  getStudentsResultOverviewsByStatus:
    get:
      tags:
        - Users
      summary: Get a list of each student's result overview
      operationId: getStudentsResultOverviewsByStatus
      parameters:
