operations:
  getGroupStats:
    get:
      tags:
        - Users
      summary: Get some stats infos about students.
      operationId: getGroupStats
      responses:
        '200':
          description: Stats info
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/GroupStatistics'
  getStats:
    get:
      tags:
        - Users
      summary: Get some stats infos about students.
      operationId: getStats
      responses:
        '200':
          description: Stats info
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/Statistics'
  studentsWorkInfo:
    get:
      tags:
        - Users
      summary: Get student work info.
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      operationId: getStudentWorkInfo
      responses:
        '200':
          description: List of Student work info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/WorkStudyStudent'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
    put:
      tags:
        - Users
      summary: Create or update work study info of Student.
      parameters:
        - name: id
          required: true
          schema:
            type: string
          in: path
      operationId: createOrUpdateStudentWorkStudyInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components.yml#/components/schemas/CrupdateWorkStudyStudent'
      responses:
        '200':
          description: List of Student work info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/WorkStudyStudent'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  studentsById:
    get:
      tags:
        - Users
      summary: Get student by identifier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      operationId: getStudentById
      responses:
        '200':
          description: The identified student
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/Student'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
    put:
      tags:
        - Users
      summary: Update student
      operationId: updateStudent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: Student to update
        required: true
        content:
          application/json:
            schema:
              $ref: '../components.yml#/components/schemas/CrupdateStudent'
      responses:
        '200':
          description: student updated.
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/Student'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  getStudentLevel:
    get:
      tags:
