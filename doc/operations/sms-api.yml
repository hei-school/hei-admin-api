operations:
  smsContacts:
    get:
      tags:
        - Sms
      summary: List the authenticated account's SMS contacts
      description: >
        contact_group_id and owner_role are optional and independent: omit both for the whole
        address book, pass one alone to filter by group or by owner type, or combine both.
      operationId: getSmsContacts
      parameters:
        - name: contact_group_id
          in: query
          required: false
          schema:
            type: string
        - name: owner_role
          in: query
          required: false
          description: Filter to contacts whose owner has this role.
          schema:
            $ref: '../components.yml#/components/schemas/SmsContactOwnerRole'
        - name: page
          in: query
          required: true
          schema:
            $ref: '../components.yml#/components/schemas/Page'
        - name: page_size
          in: query
          required: true
          schema:
            $ref: '../components.yml#/components/schemas/PageSize'
      responses:
        '200':
          description: The account's contacts, most recently added first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/SmsContact'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '500':
          $ref: '../components.yml#/components/responses/500'
  smsContactById:
    get:
      tags:
        - Sms
      summary: Get a single SMS contact
      operationId: getSmsContactById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The contact
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsContact'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '500':
          $ref: '../components.yml#/components/responses/500'
    delete:
      tags:
        - Sms
      summary: Delete an SMS contact
      description: >
        Soft delete, from the SMS address book/groups only — does not touch the underlying user,
        and nothing recreates the contact automatically afterwards.
      operationId: deleteSmsContact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The deleted contact
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsContact'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '500':
          $ref: '../components.yml#/components/responses/500'
  smsContactMessages:
    post:
      tags:
        - Sms
      summary: Send an SMS to a single contact
      description: >
        A shortcut for a 1-recipient campaign: same balance check and background send as
        the bulk flows, trackable afterwards via getSmsCampaignById/getSmsCampaignLogs.
        sendAt is optional — omit it to send right away, or schedule it like any other campaign.
      operationId: sendSmsMessageToContact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components.yml#/components/schemas/SendSmsToContact'
      responses:
        '202':
          description: Message accepted and sending in the background
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsCampaignLaunched'
        '400':
          description: >
            Bad request, including insufficient balance — see SmsInsufficientBalanceAlert
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsInsufficientBalanceAlert'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '500':
          $ref: '../components.yml#/components/responses/500'
  smsContactGroups:
    get:
      tags:
        - Sms
      summary: List the authenticated account's SMS contact groups
      description: >
        Lean listing (no members — see getSmsContacts with contact_group_id, or
        getSmsContactGroupById), safe to back a campaign-target picker even for large groups.
      operationId: getSmsContactGroups
      parameters:
        - name: page
          in: query
          required: true
          schema:
            $ref: '../components.yml#/components/schemas/Page'
        - name: page_size
          in: query
          required: true
          schema:
            $ref: '../components.yml#/components/schemas/PageSize'
      responses:
        '200':
          description: The account's contact groups, most recently created first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/SmsContactGroup'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '500':
          $ref: '../components.yml#/components/responses/500'
    post:
      tags:
        - Sms
      summary: Create an SMS contact group
      operationId: createSmsContactGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components.yml#/components/schemas/CrupdateSmsContactGroup'
      responses:
        '200':
          description: The created group
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsContactGroup'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '500':
          $ref: '../components.yml#/components/responses/500'
  smsContactGroupById:
    get:
      tags:
        - Sms
      summary: Get an SMS contact group with its members
      description: >
        Unlike getSmsContactGroups, this embeds the full member list (name and phone number),
        fine here since it is scoped to a single group.
      operationId: getSmsContactGroupById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The group and its members
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsContactGroupDetail'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '500':
          $ref: '../components.yml#/components/responses/500'
    put:
      tags:
        - Sms
      summary: Rename an SMS contact group or replace its members
      operationId: updateSmsContactGroup
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components.yml#/components/schemas/CrupdateSmsContactGroup'
      responses:
        '200':
          description: The updated group
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsContactGroup'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '500':
          $ref: '../components.yml#/components/responses/500'
    delete:
      tags:
        - Sms
      summary: Delete an SMS contact group
      description: Soft delete. Members are untouched — only the group and its use as a campaign target are removed.
      operationId: deleteSmsContactGroup
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The deleted group
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsContactGroup'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '500':
          $ref: '../components.yml#/components/responses/500'

  smsBalance:
    get:
      tags:
        - Sms
      summary: Get the current BEFIANA SMS balance
      description: >
        Live from BEFIANA on every call, so it may back the pre-send balance check as well
        as a balance widget. BEFIANA's exact response shape is still to be confirmed.
      operationId: getSmsBalance
      responses:
        '200':
          description: The current balance
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsBalance'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '500':
          $ref: '../components.yml#/components/responses/500'

  smsCampaigns:
    post:
      tags:
        - Sms
      summary: Launch an SMS campaign to any combination of contact group(s), a manual contact selection, ad hoc numbers, and a file
      description: >
        Every recipient source in CrupdateSmsCampaign is optional and combinable — contact
        group(s), a manual selection of contacts, numbers typed directly, and an uploaded file
        can all be used together in one campaign; duplicates are merged. Cost is computed as
        recipients × message segments (see SmsCampaign.smsSegmentsEach — a message over the
        single-segment character limit costs more per recipient, not a flat 1), then checked
        against balance: if it can't cover a single recipient, 400 returns the available balance
        and how many recipients it would cover instead — nothing is created (for a single
        recipient, i.e. sendSmsMessageToContact, the front-end is expected to head this off
        before it is even attempted). If balance covers some but not all, the campaign is still
        created and sent to as many recipients as it covers; the rest are never attempted and
        counted in recipientsRejectedForBalance. For a scheduled campaign (sendAt in the future),
        this same balance check runs again right before actual dispatch rather than at creation
        time — a full or partial shortfall discovered then no longer blocks anything (the
        campaign already exists), but is reflected the same way in recipientsRejectedForBalance/
        failureReason, and additionally raises a Notification and e-mails the account's admins
        (a different message than the creation-time 400, since by dispatch time the campaign is
        past the point where the person who created it is still watching). Recipients actually
        attempted are then sent in the background: a personalized file row (see
        CrupdateSmsCampaign.file) and, more generally, any campaign that resolves to exactly 1
        attempted recipient goes through /send/, so its delivery is trackable via
        getSmsCampaignLogs; every other (non-personalized) recipient sharing the campaign's
        message goes through /sendbulk/ instead, chunked if BEFIANA caps batch size — a live test
        call confirmed BEFIANA returns no callbackData at all for a bulk send, so none of those
        recipients' delivery can ever be tracked, only the campaign-level smsSegmentsEach/
        creditsDebited BEFIANA also returns for /sendbulk/. If a chunk's send call is rejected
        outright by BEFIANA (as opposed to being skipped up front for balance) its recipients are
        marked SmsLog.status FAILED — a real, knowable failure, as opposed to a
        successfully-submitted bulk recipient whose actual delivery is simply never knowable. The
        campaign itself only ends up SmsCampaignStatus FAILED (with failureReason set, and the
        same Notification/e-mail as a dispatch-time balance shortfall) if not a single recipient
        was attempted at all; otherwise it reaches DELIVERED with every rejection reflected in
        recipientsRejectedForBalance/failedCount instead. Poll getSmsCampaignById for progress
        either way.
      operationId: createSmsCampaign
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '../components.yml#/components/schemas/CrupdateSmsCampaign'
      responses:
        '202':
          description: Campaign accepted and sending in the background
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsCampaignLaunched'
        '400':
          description: >
            Bad request, including insufficient balance — see SmsInsufficientBalanceAlert
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsInsufficientBalanceAlert'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '500':
          $ref: '../components.yml#/components/responses/500'
    get:
      tags:
        - Sms
      summary: List the authenticated account's SMS campaigns
      operationId: getSmsCampaigns
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '../components.yml#/components/schemas/SmsCampaignStatus'
        - name: page
          in: query
          required: true
          schema:
            $ref: '../components.yml#/components/schemas/Page'
        - name: page_size
          in: query
          required: true
          schema:
            $ref: '../components.yml#/components/schemas/PageSize'
      responses:
        '200':
          description: The account's campaigns, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/SmsCampaign'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '500':
          $ref: '../components.yml#/components/responses/500'
  smsCampaignById:
    get:
      tags:
        - Sms
      summary: Get an SMS campaign's aggregate status
      description: >
        Includes contactGroupId/contactGroupName or contactIds, whichever the campaign was
        launched with, so the original target stays visible after the fact.
      operationId: getSmsCampaignById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The campaign
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsCampaign'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '500':
          $ref: '../components.yml#/components/responses/500'
  smsCampaignLogs:
    get:
      tags:
        - Sms
      summary: List the per-recipient delivery log of an SMS campaign
      description: >
        One entry per SMS sent: recipient, status, timestamps, BEFIANA's callbackData, and where
        the recipient came from (contact, group, or imported file). status is filled in by a
        background job polling GET /get-delivery-status/ one callbackData at a time — see
        SmsMessageStatus. Most recent first.
      operationId: getSmsCampaignLogs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '../components.yml#/components/schemas/SmsMessageStatus'
        - name: page
          in: query
          required: true
          schema:
            $ref: '../components.yml#/components/schemas/Page'
        - name: page_size
          in: query
          required: true
          schema:
            $ref: '../components.yml#/components/schemas/PageSize'
      responses:
        '200':
          description: The campaign's delivery log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/SmsLog'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '500':
          $ref: '../components.yml#/components/responses/500'
