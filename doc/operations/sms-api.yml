operations:
  smsContacts:
    get:
      tags:
        - Sms
      summary: List the authenticated account's SMS contacts
      description: >
        contact_group_id and owner_role are optional and independent: omit both for the whole
        address book, pass one alone to filter by group or by owner type, or combine both.
      operationId: getSmsContacts
      parameters:
        - name: contact_group_id
          in: query
          required: false
          schema:
            type: string
        - name: owner_role
          in: query
          required: false
          description: Filter to contacts whose owner has this role.
          schema:
            $ref: '../components.yml#/components/schemas/SmsContactOwnerRole'
        - name: page
          in: query
          required: true
          schema:
            $ref: '../components.yml#/components/schemas/Page'
        - name: page_size
          in: query
          required: true
          schema:
            $ref: '../components.yml#/components/schemas/PageSize'
      responses:
        '200':
          description: The account's contacts, most recently added first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/SmsContact'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '500':
          $ref: '../components.yml#/components/responses/500'
  smsContactById:
    get:
      tags:
        - Sms
      summary: Get a single SMS contact
      operationId: getSmsContactById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The contact
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsContact'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '500':
          $ref: '../components.yml#/components/responses/500'
    delete:
      tags:
        - Sms
      summary: Delete an SMS contact
      description: >
        Soft delete, from the SMS address book/groups only — does not touch the underlying user,
        and nothing recreates the contact automatically afterwards.
      operationId: deleteSmsContact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The deleted contact
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsContact'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '500':
          $ref: '../components.yml#/components/responses/500'
  smsContactMessages:
    post:
      tags:
        - Sms
      summary: Send an SMS to a single contact
      description: >
        A shortcut for a 1-recipient campaign: same balance check and background send as
        the bulk flows, trackable afterwards via getSmsCampaignById/getSmsCampaignLogs. Always
        sent right away — there is no scheduling.
      operationId: sendSmsMessageToContact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components.yml#/components/schemas/SendSmsToContact'
      responses:
        '202':
          description: Message accepted and sending in the background
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsCampaignLaunched'
        '400':
          description: >
            Bad request, including insufficient balance — see SmsInsufficientBalanceAlert
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsInsufficientBalanceAlert'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '500':
          $ref: '../components.yml#/components/responses/500'
  smsContactGroups:
    get:
      tags:
        - Sms
      summary: List the authenticated account's SMS contact groups
      description: >
        Lean listing (no members — see getSmsContacts with contact_group_id, or
        getSmsContactGroupById), safe to back a campaign-target picker even for large groups.
      operationId: getSmsContactGroups
      parameters:
        - name: page
          in: query
          required: true
          schema:
            $ref: '../components.yml#/components/schemas/Page'
        - name: page_size
          in: query
          required: true
          schema:
            $ref: '../components.yml#/components/schemas/PageSize'
      responses:
        '200':
          description: The account's contact groups, most recently created first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/SmsContactGroup'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '500':
          $ref: '../components.yml#/components/responses/500'
    post:
      tags:
        - Sms
      summary: Create an SMS contact group
      operationId: createSmsContactGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components.yml#/components/schemas/CrupdateSmsContactGroup'
      responses:
        '200':
          description: The created group
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsContactGroup'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '500':
          $ref: '../components.yml#/components/responses/500'
  smsContactGroupById:
    get:
      tags:
        - Sms
      summary: Get an SMS contact group with its members
      description: >
        Unlike getSmsContactGroups, this embeds the full member list (name and phone number),
        fine here since it is scoped to a single group.
      operationId: getSmsContactGroupById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The group and its members
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsContactGroupDetail'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '500':
          $ref: '../components.yml#/components/responses/500'
    put:
      tags:
        - Sms
      summary: Rename an SMS contact group or replace its members
      operationId: updateSmsContactGroup
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components.yml#/components/schemas/CrupdateSmsContactGroup'
      responses:
        '200':
          description: The updated group
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsContactGroup'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '500':
          $ref: '../components.yml#/components/responses/500'
    delete:
      tags:
        - Sms
      summary: Delete an SMS contact group
      description: Soft delete. Members are untouched — only the group and its use as a campaign target are removed.
      operationId: deleteSmsContactGroup
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The deleted group
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsContactGroup'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '500':
          $ref: '../components.yml#/components/responses/500'

  smsContactGroupMember:
    post:
      tags:
        - Sms
      summary: Add a contact to an SMS contact group
      description: >
        Adds a single existing contact without touching the rest of the group's members — unlike
        updateSmsContactGroup's contactIds, which replaces the whole list. A no-op (not an error)
        if the contact is already a member.
      operationId: addSmsContactGroupMember
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: contact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The group with its updated member list
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsContactGroupDetail'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '500':
          $ref: '../components.yml#/components/responses/500'
    delete:
      tags:
        - Sms
      summary: Remove a contact from an SMS contact group
      description: >
        Removes a single member without touching the rest of the group. The contact itself is
        untouched — only its membership in this group is removed.
      operationId: removeSmsContactGroupMember
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: contact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The group with its updated member list
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsContactGroupDetail'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '500':
          $ref: '../components.yml#/components/responses/500'

  smsBalance:
    get:
      tags:
        - Sms
      summary: Get the current BEFIANA SMS balance
      description: >
        Live from BEFIANA on every call, so it may back the pre-send balance check as well
        as a balance widget. BEFIANA's exact response shape is still to be confirmed.
      operationId: getSmsBalance
      responses:
        '200':
          description: The current balance
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsBalance'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '500':
          $ref: '../components.yml#/components/responses/500'

  smsCampaigns:
    get:
      tags:
        - Sms
      summary: List the authenticated account's SMS campaigns
      operationId: getSmsCampaigns
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '../components.yml#/components/schemas/SmsCampaignStatus'
        - name: page
          in: query
          required: true
          schema:
            $ref: '../components.yml#/components/schemas/Page'
        - name: page_size
          in: query
          required: true
          schema:
            $ref: '../components.yml#/components/schemas/PageSize'
      responses:
        '200':
          description: The account's campaigns, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/SmsCampaign'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '500':
          $ref: '../components.yml#/components/responses/500'
  smsCampaignsByContacts:
    post:
      tags:
        - Sms
      summary: Launch an SMS campaign to a selection of existing contacts
      description: >
        Cost (recipients × segments) is checked against balance: if it can't cover even one
        recipient, it 400s and creates nothing; if it covers some, the campaign is created and
        sent to those it can, the rest counted separately. Always sent right away — there is no
        scheduling. Sending happens in the background: a single recipient goes through `/send/`
        (trackable), several through `/sendbulk/` (delivery not trackable, except outright
        BEFIANA rejections which do mark a real failure). The campaign ends up `FAILED` only if
        no recipient was attempted at all; otherwise `DELIVERED`, with failures tracked
        separately.
      operationId: createSmsCampaignByContacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components.yml#/components/schemas/CrupdateSmsCampaignByContacts'
      responses:
        '202':
          description: Campaign accepted and sending in the background
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsCampaignLaunched'
        '400':
          description: >
            Bad request, including insufficient balance — see SmsInsufficientBalanceAlert
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsInsufficientBalanceAlert'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '500':
          $ref: '../components.yml#/components/responses/500'
  smsCampaignsByManualNumbers:
    post:
      tags:
        - Sms
      summary: Launch an SMS campaign to ad hoc phone numbers
      description: >
        Same cost/balance/dispatch behavior as createSmsCampaignByContacts — see its description.
      operationId: createSmsCampaignByManualNumbers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components.yml#/components/schemas/CrupdateSmsCampaignByManualNumbers'
      responses:
        '202':
          description: Campaign accepted and sending in the background
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsCampaignLaunched'
        '400':
          description: >
            Bad request, including insufficient balance — see SmsInsufficientBalanceAlert
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsInsufficientBalanceAlert'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '500':
          $ref: '../components.yml#/components/responses/500'
  smsCampaignsByGroups:
    post:
      tags:
        - Sms
      summary: Launch an SMS campaign to one or more saved contact groups
      description: >
        Same cost/balance/dispatch behavior as createSmsCampaignByContacts — see its description.
      operationId: createSmsCampaignByGroups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components.yml#/components/schemas/CrupdateSmsCampaignByGroups'
      responses:
        '202':
          description: Campaign accepted and sending in the background
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsCampaignLaunched'
        '400':
          description: >
            Bad request, including insufficient balance — see SmsInsufficientBalanceAlert
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsInsufficientBalanceAlert'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '500':
          $ref: '../components.yml#/components/responses/500'
  smsCampaignsByFile:
    post:
      tags:
        - Sms
      summary: Launch an SMS campaign from an uploaded contacts file
      description: >
        Its own endpoint, separate from the other recipient sources, because it's the only one
        that needs a multipart/form-data body — see CrupdateSmsCampaignByFile. message is a
        query parameter, not a body field: the Lambda deployment's HTTP adapter cannot read a
        text field placed inside a multipart body (it only reads the query string and
        application/x-www-form-urlencoded bodies), so anything other than the file itself has to
        travel as a query parameter here. Same cost/balance/dispatch behavior as
        createSmsCampaignByContacts otherwise, plus an all-or-nothing check on the file's own
        rows — see CrupdateSmsCampaignByFile.file and the 400 response below.
      operationId: createSmsCampaignByFile
      parameters:
        - name: message
          in: query
          required: false
          description: >-
            Sent to every row if file only has a phone number column. Not needed if file is
            personalized (two columns) — see CrupdateSmsCampaignByFile.file.
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '../components.yml#/components/schemas/CrupdateSmsCampaignByFile'
      responses:
        '202':
          description: Campaign accepted and sending in the background
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsCampaignLaunched'
        '400':
          description: >
            Bad request. Shown here: one or more unreadable file rows, none of which are ever
            sent (SmsFileRowsRejectedAlert) — the file-specific failure mode. Insufficient
            balance can also 400 here with SmsInsufficientBalanceAlert's shape instead, same as
            every other createSmsCampaignBy* operation.
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsFileRowsRejectedAlert'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '500':
          $ref: '../components.yml#/components/responses/500'
  smsCampaignById:
    get:
      tags:
        - Sms
      summary: Get an SMS campaign's aggregate status
      description: >
        Includes contactGroupId/contactGroupName or contactIds, whichever the campaign was
        launched with, so the original target stays visible after the fact.
      operationId: getSmsCampaignById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The campaign
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/SmsCampaign'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '500':
          $ref: '../components.yml#/components/responses/500'
  smsCampaignLogs:
    get:
      tags:
        - Sms
      summary: List the per-recipient delivery log of an SMS campaign
      description: >
        One entry per SMS sent: recipient, status, timestamps, BEFIANA's callbackData, and where
        the recipient came from (contact, group, or imported file). status is filled in by a
        background job polling GET /get-delivery-status/ one callbackData at a time — see
        SmsMessageStatus. Most recent first.
      operationId: getSmsCampaignLogs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '../components.yml#/components/schemas/SmsMessageStatus'
        - name: page
          in: query
          required: true
          schema:
            $ref: '../components.yml#/components/schemas/Page'
        - name: page_size
          in: query
          required: true
          schema:
            $ref: '../components.yml#/components/schemas/PageSize'
      responses:
        '200':
          description: The campaign's delivery log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/SmsLog'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '500':
          $ref: '../components.yml#/components/responses/500'
