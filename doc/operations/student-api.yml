operations:
  createStatusChecks:
    post:
      tags:
        - Student
      summary: Create a student status check
      description: Create status check for a given student
      operationId: createStatusChecks
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: The status checks to create on a given student
        required: true
        content:
          application/json:
            schema:
              $ref: '../components.yml#/components/schemas/CreateStatusCheck'
      responses:
        '200':
          description: The created status checks for the given student
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/StatusCheck'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  updateStatusCheck:
    patch:
      tags:
        - Student
      summary: Update a student status check
      description: Update status check for a given student
      operationId: updateStatusCheck
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: string
        - name: status_check_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: status check to update
        required: true
        content:
          application/json:
            schema:
              $ref: '../components.yml#/components/schemas/UpdateStatusCheck'
      responses:
        '200':
          description: The created or updated status-checks
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/StatusCheck'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  getStudentStatusChecks:
    get:
      tags:
        - Student
      operationId: getStudentStatusChecks
      summary: Get all status checks for a given student
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: All status checks asked by all teachers on a given student
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/StatusCheck'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  getAllStatusChecks:
    get:
      tags:
        - Student
      operationId: getAllStatusChecks
      summary: Get all status checks with student info
      description: Retrieve all status checks across all students, including their associated student information.
      parameters:
        - name: result
          in: query
          required: false
          schema:
            allOf:
              - $ref: '../components.yml#/components/schemas/StatusCheckResult'
          description: Filter status checks by result.
      responses:
        '200':
          description: All status checks with their associated student information
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/StatusCheck'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
