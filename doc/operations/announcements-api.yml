operations:
  announcements:
    get:
      tags:
        - Announcements
      summary: All announcements
      operationId: getAnnouncements
      parameters:
        - name: page
          in: query
          schema:
            $ref: '../components.yml#/components/schemas/Page'
          description: Set value to 1 by default if null is provided
          required: false
        - name: page_size
          in: query
          description: Set value to 15 by default if null is provided
          schema:
            $ref: '../components.yml#/components/schemas/PageSize'
          required: false
        - name: from
          in: query
          description: Filter announcements from a given date
          schema:
            type: string
            format: date-time
          required: false
        - name: to
          in: query
          description: Filter events before a given date
          schema:
            type: string
            format: date-time
        - name: author_ref
          in: query
          description: Filter announcements by author ref
          schema:
            type: string
        - name: scope
          in: query
          description: Filter by scope
          schema:
            $ref: '../components.yml#/components/schemas/Scope'
      responses:
        '200':
          description: Announcements filtered with criteria if provided
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/Announcement'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'

    post:
      tags:
        - Announcements
      summary: Create an announcement
      operationId: createAnnouncement
      requestBody:
        description: Infos about the announcement to create
        required: true
        content:
          application/json:
            schema:
              $ref: '../components.yml#/components/schemas/CreateAnnouncement'
      responses:
        '200':
          description: The announcement created
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/Announcement'
  getAnnouncementById:
    get:
      tags:
        - Announcements
      summary: Get announcement by identifier
      parameters:
        - name: id
          required: true
          schema:
            type: string
          in: path
      operationId: getAnnouncementById
      responses:
        '200':
          description: Announcement by identifier
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/Announcement'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  reactToAnnouncement:
    put:
      tags:
        - Announcements
      summary: change the reaction for an announcement
      parameters:
        - name: announcements_id
          required: true
          schema:
            type: string
          in: path
      operationId: reactToAnnouncement
      requestBody:
        description: the reaction for the announcement
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reaction:
                  $ref: '../components.yml#/components/schemas/ReactionEnum'
      responses:
        '200':
          description: Announcement with reactions
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/Announcement'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
