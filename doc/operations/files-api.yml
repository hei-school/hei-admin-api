operations:
  getSchoolRegulations:
    get:
      tags:
        - Files
      summary: Get school documents
      operationId: getSchoolRegulations
      parameters:
        - name: page
          in: query
          schema:
            $ref: '../components.yml#/components/schemas/Page'
          description: Set value to 1 by default if null is provided
          required: true
        - name: page_size
          in: query
          description: Set value to 15 by default if null is provided
          required: true
          schema:
            $ref: '../components.yml#/components/schemas/PageSize'
      responses:
        '200':
          description: List of school documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/FileInfo'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  getSchoolRegulationById:
    get:
      tags:
        - Files
      summary: Get school documents by identifier.
      operationId: getSchoolRegulationById
      parameters:
        - name: id
          in: path
          required: true
          description: file id
          schema:
            type: string
      responses:
        '200':
          description: File by id
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/FileInfo'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  uploadSchoolFile:
    post:
      tags:
        - Files
      summary: Upload school documents
      parameters:
        - name: file_type
          required: true
          schema:
            $ref: '../components.yml#/components/schemas/FileType'
          in: query
        - name: filename
          required: true
          schema:
            type: string
          in: query
      operationId: uploadSchoolFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '../components.yml#/components/schemas/UploadFile'
      responses:
        '200':
          description: Document uploaded
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/FileInfo'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  getSchoolFilesShareLink:
    get:
      tags:
        - Files
      summary: get a share link to access files or folder in owncloud
      operationId: getSchoolFilesShareLink
      parameters:
        - name: path
          in: query
          required: true
          description: should begin with `/`
          example: "/path/to/the/folder"
          schema:
            type: string
      responses:
        '200':
          description: Share link with additional infos
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/ShareInfo'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  getUserFilesById:
    get:
      tags:
        - Files
      summary: Get user file by identifier
      operationId: getUserFilesById
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: file id
          schema:
            type: string
      responses:
        '200':
          description: File by id
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/FileInfo'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  getStudentWorkDocuments:
    get:
      tags:
        - Files
      summary: Get student work documents
      operationId: getStudentWorkDocuments
      parameters:
        - name: student_id
          required: true
          schema:
            type: string
          in: path
        - name: page
          in: query
          schema:
            $ref: '../components.yml#/components/schemas/Page'
          description: Set value to 1 by default if null is provided
          required: true
        - name: page_size
          in: query
          description: Set value to 15 by default if null is provided
          required: true
          schema:
            $ref: '../components.yml#/components/schemas/PageSize'
        - name: professional_experience
          in: query
          description: Filter student work files by Professional Experience status
          required: false
          schema:
            $ref: '../components.yml#/components/schemas/ProfessionalExperienceFileTypeEnum'
      responses:
        '200':
          description: List of student work documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/WorkDocumentInfo'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  getStudentWorkDocumentsById:
    get:
      tags:
        - Files
      summary: Get student work documents
      operationId: getStudentWorkDocumentsById
      parameters:
        - name: student_id
          required: true
          schema:
            type: string
          in: path
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Student work documents
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/WorkDocumentInfo'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  uploadStudentWorkFile:
    post:
      tags:
        - Files
      summary: Upload student work file
      parameters:
        - name: student_id
          required: true
          schema:
            type: string
          in: path
        - name: filename
          required: true
          schema:
            type: string
          in: query
        - name: commitment_begin
          required: true
          in: query
          schema:
            type: string
            format: date-time
        - name: commitment_end
          required: false
          in: query
          schema:
            type: string
            format: date-time
        - name: creation_datetime
          required: false
          in: query
          schema:
            type: string
            format: date-time
        - name: experience_type
          required: true
          in: query
          schema:
            $ref: '../components.yml#/components/schemas/ProfessionalExperienceFileTypeEnum'
      operationId: uploadStudentWorkFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '../components.yml#/components/schemas/UploadFile'
      responses:
        '200':
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/WorkDocumentInfo'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  uploadUserFile:
    post:
      tags:
        - Files
      summary: Upload user file
      parameters:
        - name: user_id
          required: true
          schema:
            type: string
          in: path
        - name: file_type
          required: true
          schema:
            $ref: '../components.yml#/components/schemas/FileType'
          in: query
        - name: filename
          required: true
          schema:
            type: string
          in: query
      operationId: uploadUserFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '../components.yml#/components/schemas/UploadFile'
      responses:
        '200':
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/FileInfo'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  getUserFiles:
    get:
      tags:
        - Files
      summary: Get user files
      operationId: getUserFiles
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: file_type
          in: query
          required: false
          schema:
            $ref: '../components.yml#/components/schemas/FileType'
        - name: page
          in: query
          schema:
            $ref: '../components.yml#/components/schemas/Page'
          description: Set value to 1 by default if null is provided
          required: true
        - name: page_size
          in: query
          required: true
          description: Set value to 15 by default if null is provided
          schema:
            $ref: '../components.yml#/components/schemas/PageSize'
      responses:
        '200':
          description: List of user files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components.yml#/components/schemas/FileInfo'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  getStudentScholarshipCertificate:
    get:
      tags:
        - Files
      summary: Get scholarship certificate of a student.
      operationId: getStudentScholarshipCertificate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Scholarship certificate of student
          content:
            application/pdf:
              schema:
                type: string
                format: byte
                example: PDF VERSION
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
