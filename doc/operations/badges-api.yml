operations:
  getPublicStudent:
    get:
      tags:
        - Badges
      summary: Get public information of a student from its public id.
      description: |
        Public endpoint (no authentication), called when the badge QR code is scanned.
        The public id is random and never reveals the real student id.
        A revoked or expired badge only gives its invalidity, no information on the student.
        404 for an unknown public id, or a value that is not a public id.
      security: [ ]
      operationId: getPublicStudent
      parameters:
        - name: id
          in: path
          required: true
          description: public id of the student
          schema:
            type: string
      responses:
        '200':
          description: Public information of the student
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/PublicStudent'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  getBadgeOwner:
    get:
      tags:
        - Badges
      summary: Get the real id of the student of a badge.
      description: For connected managers and admins, to open the profile and fees of the student.
      operationId: getBadgeOwner
      parameters:
        - name: id
          in: path
          required: true
          description: public id of the student
          schema:
            type: string
      responses:
        '200':
          description: The student of the badge
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/BadgeOwner'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  getBadgeStudentSituation:
    get:
      tags:
        - Badges
      summary: Get the situation of the student of a valid badge.
      description: |
        For connected teachers, managers and admins: the status of the student and why it is
        suspended (its late fees, without their amounts).
      operationId: getBadgeStudentSituation
      parameters:
        - name: id
          in: path
          required: true
          description: public id of the student
          schema:
            type: string
      responses:
        '200':
          description: The situation of the student
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/StudentSituation'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  revokeStudentBadge:
    put:
      tags:
        - Badges
      summary: Revoke a lost badge.
      description: The public id stops working, a new one is generated on the next badge print.
      operationId: revokeStudentBadge
      parameters:
        - name: id
          in: path
          required: true
          description: public id of the student
          schema:
            type: string
      responses:
        '200':
          description: The student of the revoked badge
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/PublicStudent'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  getStudentActiveBadge:
    get:
      tags:
        - Badges
      summary: Get the active badge of a student.
      description: 404 when the student has no active badge (never printed, or removed).
      operationId: getStudentActiveBadge
      parameters:
        - name: id
          in: path
          required: true
          description: real id of the student
          schema:
            type: string
      responses:
        '200':
          description: The active badge of the student
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/PublicStudent'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  revokeStudentActiveBadge:
    put:
      tags:
        - Badges
      summary: Remove the active badge of a student.
      description: |
        Its QR code stops working; a new public id is generated on the next badge print.
      operationId: revokeStudentActiveBadge
      parameters:
        - name: id
          in: path
          required: true
          description: real id of the student
          schema:
            type: string
      responses:
        '200':
          description: The removed badge
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/PublicStudent'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
  checkEventAttendanceByPublicId:
    put:
      tags:
        - Events
      summary: Check the attendance of a student to an event by scanning its badge.
      description: Teachers only.
      operationId: checkEventAttendanceByPublicId
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: public id of the student
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: PRESENT by default
          schema:
            $ref: '../components.yml#/components/schemas/AttendanceStatus'
      responses:
        '200':
          description: The updated event participant
          content:
            application/json:
              schema:
                $ref: '../components.yml#/components/schemas/EventParticipant'
        '400':
          $ref: '../components.yml#/components/responses/400'
        '403':
          $ref: '../components.yml#/components/responses/403'
        '404':
          $ref: '../components.yml#/components/responses/404'
        '429':
          $ref: '../components.yml#/components/responses/429'
        '500':
          $ref: '../components.yml#/components/responses/500'
