components:
  parameters:
    PageSize:
      name: page_size
      in: query
      example: 50
      required: false
      description: Page size for the retrieved ressources
      schema:
        $ref: '#/components/schemas/PageSize'
    Page:
      name: page
      in: query
      example: 1
      required: false
      description: Page number for the retrieved ressources
      schema:
        $ref: '#/components/schemas/Page'
    DatetimeFromFilter:
      name: from
      in: query
      description: Filter creation date result by a given date
      schema:
        type: string
        format: date-time
      required: false
    DatetimeToFilter:
      name: to
      in: query
      description: Filter creation date result by a given date
      schema:
        type: string
        format: date-time
      required: false
    UpdateDateSort:
      name: sortDate
      in: query
      description: Sort update date result, no sort by default
      required: false
      schema:
        $ref: '#/components/schemas/SortOrder'
    GroupRef:
      name: group_ref
      in: query
      style: form
      explode: true
      required: false
      description: Filter by group ref
      schema:
        type: array
        items:
          type: string
    CorStatuses:
      name: cor_status
      in: query
      style: form
      explode: true
      required: false
      description: Filter by cor actual status
      schema:
        type: array
        items:
          $ref: '#/components/schemas/CorStatus'
    StudentRef:
      name: student_ref
      in: query
      example: STD21001
      required: false
      description: Filter by student ref
      schema:
        type: string
    StudentName:
      name: student_name
      in: query
      required: false
      description: Filter by student first name or last name
      schema:
        type: string
    TeacherId:
      name: teacher_id
      in: query
      required: false
      schema:
        type: string
    PathExamId:
      name: exams_id
      in: path
      required: true
      schema:
        type: string
    PathCourseId:
      name: course_id
      in: path
      required: true
      schema:
        type: string
    PathStudentId:
      name: student_id
      in: path
      required: true
      schema:
        type: string
    PathGradeId:
      name: grade_id
      in: path
      required: true
      schema:
        type: string
    PathMpbsId:
      name: mpbs_id
      in: path
      required: true
      schema:
        type: string
    PathCorId:
      name: cor_id
      in: path
      required: true
      schema:
        type: string
    RetakeExamStatuses:
      name: retake_exam_status
      in: query
      style: form
      explode: true
      required: false
      description: Filter by retake exam actual status
      schema:
        type: array
        items:
          $ref: '#/components/schemas/RetakeExamStatus'
    RoleParamEnum:
      name: role
      in: query
      style: form
      explode: true
      description: Filter by role
      required: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/RoleEnum'
  responses:
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequestException'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotAuthorizedException'
    '404':
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceNotFoundException'
    '429':
      description: Too many requests to the API
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsException'
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerException'
  schemas:
    Whoami:
      properties:
        id:
          type: string
        role:
          type: string
          enum:
            - MONITOR
            - STUDENT
            - TEACHER
            - MANAGER
            - ADMIN
            - STAFF_MEMBER
            - ORGANIZER
        bearer:
          type: string
    UserIdentifier:
      type: object
      properties:
        id:
          type: string
        ref:
          type: string
          example: STD000001
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        nic:
          type: string
    StudentAttendanceMovement:
      properties:
        id:
          type: string
        attendance_movement_type:
          $ref: '#/components/schemas/AttendanceMovementType'
        created_at:
          type: string
          format: date-time
        place:
          $ref: '#/components/schemas/PlaceEnum'
        student:
          $ref: '#/components/schemas/Student'
    SortOrder:
      type: string
      enum:
        - ASCENDING
        - DESCENDING
    CrupdateUser:
      allOf:
        - $ref: '#/components/schemas/UserIdentifier'
        - type: object
          properties:
            sex:
              $ref: '#/components/schemas/Sex'
            birth_date:
              type: string
              format: date
            birth_place:
              type: string
            address:
              type: string
            phone:
              type: string
            entrance_datetime:
              type: string
              format: date-time
            coordinates:
              $ref: '#/components/schemas/Coordinates'
            high_school_origin:
              type: string
            status:
              $ref: '#/components/schemas/EnableStatus'
    WorkStudyStatus:
      type: string
      enum:
        - HAVE_BEEN_WORKING
        - WILL_BE_WORKING
        - WORKING
        - NOT_WORKING
    SpecializationField:
      type: string
      enum:
        - COMMON_CORE
        - EL
        - TN
    Sex:
      type: string
      enum:
        - M
        - F
    EnableStatus:
      type: string
      enum:
        - ENABLED
        - DISABLED
        - SUSPENDED
        - ALUMNI
    FileType:
      type: string
      enum:
        - TRANSCRIPT
        - DOCUMENT
        - WORK_DOCUMENT
        - OTHER
        - PROFILE_PICTURE
    EventType:
      type: string
      enum:
        - EXAM
        - COURSE
        - INTEGRATION
        - SEMINAR
        - SUPPORT_SESSION
        - OTHER

    ### TODO: Rename to StudentAttendance when actual is renamed into StudentEventAttendance
    StudentGlobalAttendance:
      allOf:
        - $ref: '#/components/schemas/EventBase'
      type: object
      properties:
        attendance_status:
          $ref: '#/components/schemas/AttendanceStatus'

    ### TODO: rename to StudentEventAttendance or it is Student Attendance for a specific course
    StudentAttendance:
      type: object
      properties:
        id:
          type: string
        created_at:
          type: string
          format: date-time
        late_of:
          type: integer
          description: if the student is late, that defines how late he or she is
        place:
          $ref: '#/components/schemas/PlaceEnum'
        is_late:
          type: boolean
        course_session:
          $ref: '#/components/schemas/CourseSession'
        student:
          $ref: '#/components/schemas/Student'
    CourseSession:
      type: object
      properties:
        id:
          type: string
        course_assignment:
          $ref: '#/components/schemas/CourseAssignment'
        begin:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    CrupdateStudent:
      allOf:
        - $ref: '#/components/schemas/CrupdateUser'
      properties:
        specialization_field:
          $ref: '#/components/schemas/SpecializationField'
        payment_frequency:
          $ref: '#/components/schemas/PaymentFrequency'
    CrupdateMonitor:
      allOf:
        - $ref: '#/components/schemas/CrupdateUser'
      properties:
        student_refs:
          type: array
          items:
            type: string
            example: "STD20001"
    CrupdateTeacher:
      allOf:
        - $ref: '#/components/schemas/CrupdateUser'
    CrupdateManager:
      allOf:
        - $ref: '#/components/schemas/CrupdateUser'
    CrupdateOrganizer:
      allOf:
        - $ref: '#/components/schemas/CrupdateUser'
    CrupdateWorkStudyStudent:
      properties:
        id:
          type: string
        student_id:
          type: string
        commitment_begin_date:
          type: string
          format: date-time
        commitment_end_date:
          type: string
          format: date-time
        business:
          type: string
        company:
          type: string
    WorkStudyInfo:
      properties:
        id:
          type: string
        commitment_begin_date:
          type: string
          format: date-time
        commitment_end_date:
          type: string
          format: date-time
        business:
          type: string
        company:
          type: string
    WorkStudyStudent:
      allOf:
        - $ref: '#/components/schemas/UserIdentifier'
      properties:
        work_study_info:
          type: array
          items:
            $ref: '#/components/schemas/WorkStudyInfo'
    Student:
      allOf:
        - $ref: '#/components/schemas/CrupdateUser'
      properties:
        specialization_field:
          $ref: '#/components/schemas/SpecializationField'
        professional_experience:
          $ref: '#/components/schemas/ProfessionalExperienceFileTypeEnum'
        work_study_status:
          $ref: '#/components/schemas/WorkStudyStatus'
        commitment_begin_date:
          type: string
          format: date-time
        commitment_end_date:
          type: string
          format: date-time
        profile_picture:
          type: string
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        is_repeating_year:
          type: boolean
    Monitor:
      allOf:
        - $ref: '#/components/schemas/CrupdateUser'
      properties:
        profile_picture:
          type: string
    Teacher:
      allOf:
        - $ref: '#/components/schemas/CrupdateUser'
      properties:
        profile_picture:
          type: string
    Manager:
      allOf:
        - $ref: '#/components/schemas/CrupdateUser'
      properties:
        profile_picture:
          type: string
    Admin:
      allOf:
        - $ref: '#/components/schemas/CrupdateUser'
      properties:
        profile_picture:
          type: string
    Organizer:
      allOf:
        - $ref: '#/components/schemas/CrupdateUser'
      properties:
        profile_picture:
          type: string
    GroupIdentifier:
      type: object
      properties:
        attributed_color:
          type: string
        id:
          type: string
        name:
          type: string
          example: The group number one
        ref:
          type: string
          example: G1
    Group:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: The group number one
        ref:
          type: string
          example: G1
        creation_datetime:
          type: string
          format: date-time
        size:
          type: integer
        attributed_color:
          type: string
    CreateGroup:
      type: object
      properties:
        students:
          type: array
          items:
            type: string
      allOf:
        - $ref: '#/components/schemas/Group'
    GroupFlow:
      type: object
      properties:
        id:
          type: string
        flow_datetime:
          type: string
          format: date-time
      allOf:
        - $ref: '#/components/schemas/CreateGroupFlow'
    CreateGroupFlow:
      type: object
      properties:
        move_type:
          type: string
          enum:
            - JOIN
            - LEAVE
        group_id:
          type: string
        student_id:
          type: string
    UpdateGroupFlow:
      type: object
      properties:
        id:
          type: string
        group_id:
          type: string
        flow_datetime:
          type: string
          format: date-time
    CourseTemplate:
      type: object
      properties:
        id:
          type: string
        level:
          $ref: "#/components/schemas/StudentLevel"
        code:
          type: string
          example: PROG1
        name:
          type: string
          example: Algorithmics
        credits:
          type: integer
        total_hours:
          type: integer
    UpdateMonitorStudentLink:
      type: object
      properties:
        id:
          type: string
        student_id:
          type: string
        monitor_id:
          type: string
        status:
          $ref: '#/components/schemas/MonitorStudentLinkStatus'
    MonitorStudentLinkStatus:
      type: string
      enum:
        - LINKED
        - DENIED
    MonitorStudentLink:
      type: object
      properties:
        id:
          type: string
        monitor:
          $ref: '#/components/schemas/Monitor'
        student:
          $ref: '#/components/schemas/Student'
    Course:
      allOf:
        - $ref: '#/components/schemas/CourseTemplate'
    CrupdateCourseAssignment:
      type: object
      properties:
        id:
          type: string
        main_teacher_id:
          type: string
        course_id:
          type: string
        group_ids:
          type: array
          items:
            type: string
    WorkDocumentInfo:
      allOf:
        - $ref: '#/components/schemas/FileInfo'
      type: object
      properties:
        professional_experience:
          $ref: '#/components/schemas/ProfessionalExperienceFileTypeEnum'
    FileInfo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        creation_datetime:
          type: string
          format: date-time
        file_type:
          $ref: '#/components/schemas/FileType'
        file_url:
          type: string
    OwnCloudPermission:
      type: string
      enum:
        - READ
        - DELETE
        - UPDATE
        - CREATE
        - SHARE
    ShareInfo:
      type: object
      properties:
        expiration:
          type: string
        path:
          type: string
        url:
          type: string
        permission:
          type: array
          items:
            $ref: '#/components/schemas/OwnCloudPermission'
    CourseAssignment:
      type: object
      properties:
        id:
          type: string
        main_teacher:
          $ref: '#/components/schemas/Teacher'
        course:
          $ref: '#/components/schemas/Course'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'
    StudentExamGrade:
      type: object
      properties:
        score:
          type: number
          format: double
          example: 12.5
        exam:
          $ref: '#/components/schemas/Exam'
    Exam:
      type: object
      properties:
        id:
          type: string
        coefficient:
          $ref: '#/components/schemas/Fraction'
        title:
          type: string
        examination_date:
          type: string
          format: date-time
        course_assignment:
          $ref: '#/components/schemas/CourseAssignment'
    Fraction:
      type: object
      properties:
        numerator:
          type: integer
        denominator:
          type: integer
    CrupdateExam:
      type: object
      properties:
        id:
          type: string
        coefficient:
          $ref: '#/components/schemas/Fraction'
        title:
          type: string
        examination_date:
          type: string
          format: date-time
        course_assignment_id:
          type: string
    Grade:
      type: object
      required:
        - score
      properties:
        id:
          type: string
        exam:
          $ref: "#/components/schemas/Exam"
        score:
          type: number
          format: double
          example: 12.5
        created_at:
          type: string
          format: date-time
        update_date:
          type: string
          format: date-time
    StudentLevel:
      type: string
      enum:
        - L1
        - L2
        - L3
        - M1
        - M2
    ExamGradeStats:
      type: object
      properties:
        average:
          type: number
          format: double
          example: 12.5
    StudentCourseGradeStats:
      type: object
      properties:
        average:
          type: number
          format: double
          example: 12.5
    CourseResult:
      type: object
      properties:
        id:
          type: string
        course:
          $ref: "#/components/schemas/Course"
        weighted_average:
          type: number
        status:
          $ref: "#/components/schemas/CourseResultStatus"
    CourseResultStatus:
      type: string
      enum:
        - VALIDATED
        - IN_PROGRESS
        - INCOMPLETE
        - NOT_STARTED
    ResultSummary:
      type: object
      allOf:
        - $ref: "#/components/schemas/ResultsOverview"
      properties:
        yearly_results:
          type: array
          items:
            $ref: "#/components/schemas/YearlyResult"
    YearlyResult:
      type: object
      allOf:
        - $ref: "#/components/schemas/ResultsOverview"
      properties:
        level:
          $ref: "#/components/schemas/StudentLevel"
        course_results:
          type: array
          items:
            $ref: "#/components/schemas/CourseResult"
    YearlyResultGenerationTranscript:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/YearlyResultGenerationStatus"
        link:
          type: string
    YearlyResultGenerationStatus:
      type: string
      enum:
        - GENERATING
        - AVAILABLE
    StudentIdentifierGrade:
      type: object
      properties:
        weighted_average:
          type: number
          format: double
          example: 12.5
        student:
          $ref: '#/components/schemas/UserIdentifier'
    CreateGrade:
      type: object
      properties:
        score:
          type: number
          format: double
          example: 12.5
        student_id:
          type: string
    ResultsOverview:
      type: object
      properties:
        weighted_average:
          type: number
        obtained_credits:
          type: number
        status:
          $ref: '#/components/schemas/ResultOverviewStatus'
        total_credits:
          type: number
    ResultOverviewStatus:
      type: string
      enum:
        - VALIDATED
        - INVALIDATED
        - IN_PROGRESS
        - NOT_STARTED
    StudentGrade:
      properties:
        grade:
          $ref: '#/components/schemas/Grade'
        student:
          $ref: '#/components/schemas/Student'
    UpdateGrade:
      properties:
        grade:
          $ref: '#/components/schemas/CreateGrade'
        student_ref:
          type: string
        comment:
          type: string
    GradeHistory:
      properties:
        created_at:
          type: string
          format: date-time
        score:
          type: number
          format: double
          example: 12.5
        comment:
          type: string
    CourseAssignmentExam:
      allOf:
        - $ref: '#/components/schemas/CourseAssignment'
      properties:
        exams:
          type: array
          items:
            $ref: '#/components/schemas/StudentGrade'
    RetakeExamSession:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        date_from:
          type: string
          format: date-time
        date_to:
          type: string
          format: date-time
        student_levels:
          type: array
          items:
            $ref: '#/components/schemas/StudentLevel'
    RetakeExam:
      type: object
      properties:
        id:
          type: string
        course:
          $ref: "#/components/schemas/Course"
        session:
          $ref: "#/components/schemas/RetakeExamSession"
        registration_date:
          type: string
          format: date-time
        cancel_reason:
          type: string
        rejection_reason:
          type: string
        status:
          $ref: "#/components/schemas/RetakeExamStatus"
    CrupdateRetakeExam:
      type: object
      properties:
        id:
          type: string
        course_id:
          type: string
        session_id:
          type: string
        student_id:
          type: string
        status:
          $ref: "#/components/schemas/RetakeExamStatus"
    UpdateRetakeExamStatus:
      type: object
      properties:
        retake_exam_id:
          type: string
        status:
          $ref: "#/components/schemas/RetakeExamStatus"
    CancelRetakeExamRequest:
      type: object
      properties:
        retake_exam_id:
          type: string
        reason:
          type: string
          description: Reason provided by the student or manager for canceling or not cancelling the retake request
      required:
        - reason
        - retake_exam_id
    RetakeExamToCancel:
      type: object
      properties:
        retake_exam_id:
          type: string
      required:
        - retake_exam_id
    StudentRetakeExam:
      type: object
      allOf:
        - $ref: "#/components/schemas/RetakeExam"
      properties:
        ### TODO: must be Student resource ou some attributes only ?
        student_identifier:
          $ref: "#/components/schemas/UserIdentifier"
    RetakeExamStatus:
      type: string
      enum:
        - REGISTERED
        - TO_CANCEL
        - CANCELED
        - INVALIDATE
        - VALIDATE
    CreateAttendanceMovement:
      type: object
      properties:
        student_id:
          type: string
        created_at:
          type: string
          format: date-time
        attendance_movement_type:
          $ref: '#/components/schemas/AttendanceMovementType'
        place:
          $ref: '#/components/schemas/PlaceEnum'
    ProfessionalExperienceFileTypeEnum:
      type: string
      enum:
        - WORKER_STUDENT
        - BUSINESS_OWNER
        - INTERN_STUDENT
        - INTERN_PROJECT
    PlaceEnum:
      type: string
      enum:
        - IVANDRY
        - ANDRAHARO
        - UNKNOWN
    RoleEnum:
      type: string
      enum:
        - STUDENT
        - TEACHER
        - STAFF_MEMBER
    CreateFee:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/FeeTypeEnum'
        comment:
          type: string
        total_amount:
          type: integer
        creation_datetime:
          type: string
          format: date-time
        due_datetime:
          type: string
          format: date-time
        category:
          $ref: '#/components/schemas/FeeCategory'
        frequency:
          $ref: '#/components/schemas/FeeFrequency'
    CrupdateStudentFee:
      properties:
        id:
          type: string
        student_id:
          type: string
        is_archived:
          type: boolean
      allOf:
        - $ref: '#/components/schemas/CreateFee'
    ModelFee:
      allOf:
        - $ref: '#/components/schemas/Fee'
      properties:
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
    FeesWithStats:
      properties:
        statistics:
          $ref: '#/components/schemas/FeesStatistics'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Fee'
    Fee:
      allOf:
        - $ref: '#/components/schemas/CreateFee'
      type: object
      properties:
        id:
          type: string
        student_ref:
          type: string
        student_id:
          type: string
        remaining_amount:
          type: integer
        status:
          $ref: '#/components/schemas/FeeStatusEnum'
        updated_at:
          type: string
          format: date-time
        mpbs:
          type: array
          items:
            $ref: '#/components/schemas/Mpbs'
        letter:
          $ref: '#/components/schemas/FeeLetter'
        student_first_name:
          type: string
        is_archived:
          type: boolean
        archive_status:
          $ref: '#/components/schemas/ArchiveStatusEnum'
        archived_by_ref:
          type: string
        archived_by_first_name:
          type: string
        archived_by_last_name:
          type: string
    FeeCategory:
      type: string
      enum:
        - L1
        - L2
        - L3
        - OTHER
        - UNKNOWN
        - WORK_FEES
    FeeLetter:
      type: object
      properties:
        id:
          type: string
        approval_datetime:
          type: string
          format: date-time
        creation_datetime:
          type: string
          format: date-time
        ref:
          type: string
        status:
          $ref: '#/components/schemas/LetterStatus'
        file_url:
          type: string
    CreateDelayPenaltyChange:
      type: object
      properties:
        interest_percent:
          type: integer
        interest_timerate:
          type: string
          enum:
            - DAILY
        grace_delay:
          type: integer
        applicability_delay_after_grace:
          type: integer
    DelayPenalty:
      allOf:
        - $ref: '#/components/schemas/CreateDelayPenaltyChange'
      type: object
      properties:
        id:
          type: string
        creation_datetime:
          type: string
          format: date-time
    MpbsStatus:
      type: string
      enum:
        - PENDING
        - SUCCESS
        - FAILED
    MobileMoneyType:
      type: string
      enum:
        - MVOLA
        - ORANGE_MONEY
        - AIRTEL_MONEY
    PaymentStatus:
      type: string
      enum:
        - VALIDATE
        - INVALIDATE
        - CREATED
    CreatePayment:
      type: object
      properties:
        type:
          type: string
          enum:
            - BANK_TRANSFER
