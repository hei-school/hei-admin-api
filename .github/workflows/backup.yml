name: Automation backup neon
on:
    schedule:
        - cron : "0 0 * * *"
    workflow_dispatch:
env :
    NEON_CONNECTION_URL: ${{ secrets.NEON_CONNECTION_URL }}
    AWS_S3_BUCKET: ${{secrets.AWS_S3_BUCKET}}
    AWS_REGION: eu-west-3
jobs:
  backup-db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.1.6
      - name : Install postgres
        run : |
            sudo apt install -y postgresql postgresql-contrib
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.0.1
        with:
            aws-access-key-id: ${{ secrets.S3_AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.S3_AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ env.AWS_REGION }}
      - name: backup Neon db
        run: |
            set -e
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
            BACKUP_FILE="neon_backup_${TIMESTAMP}.bak"
            echo "BACKUP_FILE=$BACKUP_FILE" >> $GITHUB_ENV
            pg_dump -Fc -v -d ${NEON_CONNECTION_URL} -f "$BACKUP_FILE"
      - name : upload backup in S3
        run: |
            aws s3 cp "$BACKUP_FILE" "s3://${AWS_S3_BUCKET}/prod-backup-neon/${BACKUP_FILE}"
            rm "$BACKUP_FILE"

