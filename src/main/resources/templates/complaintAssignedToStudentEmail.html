<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Réclamation transmise à un responsable</title>
    <style type="text/css">
        body { font-family: Arial, Helvetica, sans-serif; font-size: 16px; color: #000; margin: 20px; line-height: 1.45; }
        .container { width: 780px; margin: 0; padding: 20px 30px; }
        p { margin: 18px 0; }
        .signature { margin-top: 26px; }
    </style>
</head>
<body>
<div class="container">
    <p>Bonjour,</p>
    <p>Votre réclamation « <span th:text="${title}">Titre</span> » a été transmise à un responsable le <span th:text="${date}">Date</span>
        <span th:if="${assigneeName}">(<span th:text="${assigneeName}">Responsable</span>)</span>.</p>
    <p><strong>Description :</strong><br/><span th:text="${description}">Description</span></p>
    <p>Nous vous tiendrons informé de son traitement.</p>
    <p class="signature">Cordialement,</p>
</div>
</body>
</html>
