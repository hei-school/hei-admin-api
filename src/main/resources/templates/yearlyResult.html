<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8"/>
    <title>Relevé de notes</title>
    <style>
        h2 {
            font-size: 10px;
        }

        body {
            margin: 2% 5%;
            font-size: 8px;
        }

        header {
            font-family: Georgia, 'Times New Roman', Times, serif;
            text-align: center;
            font-size: 13px;
            line-height: 0;
        }

        .logo {
            margin-top: -30px;
            text-align: center;
            width: 100%;
            height: 100%;
        }

        .logo-content {
            height: 100px;
            width: 100px;
            margin: 0 auto;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }

        h1 {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
            text-align: center;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .introduction {
            line-height: 12px;
        }

        main,
        footer {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 8px;
        }

        main div {
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .course-results {
            border-collapse: collapse;
            width: 100%;
        }

        .course-results thead {
            background-color: #dea308;
        }

        .course-results th,
        .course-results tbody tr td {
            padding-top: 4px;
            padding-bottom: 4px;
            line-height: 1.6;
        }

        .course-results td,
        .course-results th {
            border: solid 1px black;
            text-align: left;
            padding-left: 8px;
        }

        .course-results th {
            font-weight: bold;
        }

        .course-results tfoot tr td p {
            margin-top: 8px;
            margin-bottom: 8px;
        }

        footer {
            float: right;
            position: relative;
            margin-top: 36px;
        }

        ul li {
            margin-top: 5px;
            margin-bottom: 5px;
        }

        .bold {
            font-weight: bold;
        }

        .center {
            text-align: center !important;
            padding-left: 0 !important;
        }

        .student-info {
            margin-top: 5px;
            margin-bottom: 5px;
            line-height: 1.6;
        }

        .temporary-result-container {
            color: #ff2b2b;
        }

        .temporary-result-container span {
            font-weight: bold;
            text-decoration: underline;
        }

        #signature {
            margin-top: 48px;
            margin-bottom: 48px;
            height: 50px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }
        footer {
            page-break-after: always;
        }
    </style>
</head>

<body>
    <div th:utext="${transcriptContent}">
    </div>
</body>
</html>
